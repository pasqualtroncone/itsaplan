[project]
name = "commit-audit"
version = "0.1.0"
description = "Audits new commits on a watched GitHub branch for security and logic issues"
requires-python = ">=3.11"
dependencies = [
    "mistralai-workflows>=3.10",
    "mistralai-workflows[mistralai]",
    "mistralai>=3.0",
    "httpx>=0.27",
    "pydantic>=2",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
